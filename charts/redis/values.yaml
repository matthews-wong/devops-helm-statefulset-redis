image:
  repository: redis
  tag: 7.4.1-alpine
  pullPolicy: IfNotPresent

service:
  port: 6379

# Extra redis.conf lines, appended after the chart's own settings.
config: ""

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    port {{ .Values.service.port }}
    dir /data
    appendonly {{ ternary "yes" "no" .Values.persistence.enabled }}
    {{- with .Values.config }}
    {{- . | nindent 4 }}
    {{- end }}
